[project]
name = "n100-financial-intelligence"
version = "0.1.0"
description = "N100 Financial Intelligence Platform - ETL + financial ratio engine for Nifty 100 (SQLite)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "xlsxwriter>=3.1.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    "plotly>=5.18",
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
