[project]
name = "n100-financial-intelligence"
version = "0.1.0"
description = "N100 Financial Intelligence Platform - ETL + financial ratio engine for Nifty 100 (SQLite)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama==0.4.6",
    "et_xmlfile==2.0.0",
    "iniconfig==2.3.0",
    "numpy==2.5.3",
    "openpyxl==3.1.5",
    "packaging==26.3",
    "pandas==3.0.5",
    "pluggy==1.6.0",
    "pygments==2.21.0",
    "pytest==9.1.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.3",
    "pyyaml>=6.0",
    "six==1.17.0",
    "tzdata==2026.3",
    "xlrd==2.0.2",
    "streamlit>=1.36.0",
    "plotly>=5.18.0",
    "xlsxwriter>=3.1.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
